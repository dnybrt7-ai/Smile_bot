name = "smile-game-bot"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
BOT_USERNAME = "your_bot_username_without_at"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_classes = ["GameRoom"]

[[kv_namespaces]]
binding = "REGISTRY"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[triggers]
crons = ["* * * * *"]
